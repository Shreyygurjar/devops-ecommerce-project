<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DevOps Store</h1>
        <p>Welcome to our online store.</p>
        <p>Cart: <span id="cart-count">0</span></p>
    </header>

    <main>
        <h2>Products</h2>

        <section class="products">

            <div class="product">
                <h3>Wireless Headphones</h3>
                <p>₹1,999</p>
                <p>High-quality wireless headphones with clear sound.</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>Mechanical Keyboard</h3>
                <p>₹3,499</p>
                <p>Mechanical keyboard designed for gaming and work.</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>Gaming Mouse</h3>
                <p>₹1,299</p>
                <p>Fast and precise mouse for gaming and everyday use.</p>
                <button>Add to Cart</button>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
